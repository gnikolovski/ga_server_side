ga_server_side.settings:
  path: '/admin/config/services/ga-server-side'
  defaults:
    _title: 'Google Analytics - Server Side'
    _form: 'Drupal\ga_server_side\Form\SettingsForm'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE

ga_server_side.view_item_endpoint:
  path: '/ga-server-side/v1/view-item'
  methods: [POST]
  defaults:
    _controller: '\Drupal\ga_server_side\Controller\GaServerSideController::viewItem'
  requirements:
    _permission: 'access content'
  options:
    no_cache: TRUE
