ga_server_side.settings:
  type: config_object
  label: 'Google Analytics - Server Side'
  mapping:
    measurement_id:
      type: string
      label: 'Measurement ID'
    api_secret:
      type: string
      label: 'API secret'
    debug_mode:
      type: boolean
      label: 'Debug mode'
    log_events:
      type: boolean
      label: 'Detailed event logging'
